name: QualityForge AI tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Milestone 1 ships without a lockfile because the build environment cannot reach npm.
      # Switch to npm ci after generating and committing package-lock.json.
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm test
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualityforge-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
