<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QualityForge AI | Demo Wallet</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17243b;background:#f3f6fc}*{box-sizing:border-box}main{max-width:900px;margin:36px auto;padding:0 20px}header{background:#142946;color:white;padding:26px 30px;border-radius:18px}header h1{margin:0 0 6px}header p{margin:0;color:#d4e3f7}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{background:white;border:1px solid #dce4f1;border-radius:16px;padding:22px;box-shadow:0 3px 14px #14294608}label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid #b8c5d7;border-radius:8px;font:inherit}button{background:#2556bd;color:white;border:0;border-radius:9px;padding:12px 18px;margin-top:16px;font-weight:700;cursor:pointer}button:hover{background:#173e91}.muted{color:#57677f}.error{color:#b52235;min-height:20px}.card{border:1px solid #dbe5f5;border-radius:12px;padding:14px;margin:10px 0}.card strong{display:block}#count{font-weight:700}@media(max-width:700px){.panels{grid-template-columns:1fr}}
</style></head>
<body><main><header><h1>Demo Purchase Wallet</h1><p>A self-contained app to exercise QualityForge AI tests. Synthetic data only.</p></header>
<div class="panels"><section class="panel"><h2>Add a purchase</h2><form id="purchase-form" novalidate>
<label for="name">Product name</label><input id="name" data-testid="purchase-name" required>
<label for="brand">Brand</label><input id="brand" data-testid="purchase-brand" required>
<label for="price">Price</label><input id="price" data-testid="purchase-price" type="number" step="0.01" required>
<label for="date">Purchase date</label><input id="date" data-testid="purchase-date" type="date" required>
<p role="alert" class="error" data-testid="form-error"></p><button type="submit" data-testid="save-purchase">Save purchase</button></form></section>
<section class="panel"><h2>Your purchases</h2><p id="count" data-testid="purchase-count">0 purchases</p>
<label for="search">Search purchases</label><input id="search" data-testid="purchase-search" type="search" placeholder="Search by product or brand">
<div id="results" aria-live="polite"></div></section></div></main><script type="module" src="/app.js"></script></body></html>
